services:
  namenode:
    image: apache/hadoop:3
    hostname: namenode
    command: ["hdfs", "namenode"]
    env_file: ./configs/hadoop.env
    environment:
      ENSURE_NAMENODE_DIR: /tmp/hadoop-hadoop/dfs/name
    ports:
      - "9870:9870"
      - "8020:8020"
    volumes:
      - ./data:/data

  datanode:
    image: apache/hadoop:3
    command: ["hdfs", "datanode"]
    env_file: ./configs/hadoop.env
    depends_on:
      - namenode

  spark-master:
    build: ./docker/spark
    image: ids-spark:3.5.1
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - ./src:/src

  spark-worker:
    build: ./docker/spark
    image: ids-spark:3.5.1
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    depends_on:
      - spark-master

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
